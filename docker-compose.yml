# Compose file format "2.4" is the newest that classic `docker-compose` (v1,
# Python) still accepts — and it's the last format that honours
# `depends_on: { condition: service_healthy }`, which this stack relies on for
# startup ordering. Compose v2 (`docker compose`) also reads it fine (with a
# deprecation notice). Project name comes from COMPOSE_PROJECT_NAME in .env
# (or the directory name) since the top-level `name:` key is v2-only.
version: "2.4"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # max_connections raised from the default 100 so the backend can run
    # several gunicorn workers (each holds its own pool of
    # DB_POOL_SIZE + DB_MAX_OVERFLOW) with headroom for ~100 tenant
    # workspaces. See DEPLOYMENT.md → Scaling.
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    environment:
      POSTGRES_DB: ${DB_NAME:-tolkyn}
      POSTGRES_USER: ${DB_USER:-tolkyn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tolkyn} -d ${DB_NAME:-tolkyn}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence needed — only holds rate-limit counters and the
    # scheduler's leader lock, both fine to lose on restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Self-hosted WhatsApp (Baileys) — the unofficial, at-your-own-risk channel
  # while waiting on real Cloud API access. One session per workspace; auth
  # state persists in whatsapp_sessions so a container restart doesn't force
  # everyone to re-scan their QR code.
  whatsapp-worker:
    build:
      context: ./whatsapp-worker
    restart: unless-stopped
    environment:
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?set INTERNAL_SHARED_SECRET in .env}
      BACKEND_INTERNAL_URL: http://backend:8000
    volumes:
      - whatsapp_sessions:/app/sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal]
    # No published port — only the backend ever talks to this, over the
    # internal network. Never expose this publicly.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override host settings to the in-network service names regardless of
      # what backend/.env says — this is what actually makes Docker networking
      # work without hand-editing backend/.env per environment.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tolkyn}
      DB_USER: ${DB_USER:-tolkyn}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WHATSAPP_WORKER_URL: http://whatsapp-worker:4001
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:?set INTERNAL_SHARED_SECRET in .env}
      # call-centre TURN — handed to the browser softphone via /call-center/softphone
      PBX_TURN_URL: ${PBX_TURN_URL:-}
      PBX_TURN_USER: ${PBX_TURN_USER:-tolkyn}
      PBX_TURN_PASSWORD: ${PBX_TURN_PASSWORD:-}
    volumes:
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whatsapp-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]
    # No published ports — nginx is the only public entry point.

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://tolkyn.co.ke/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  # TURN relay — a browser-side fallback path for WebRTC audio when the agent's
  # NAT won't allow a direct route to the PBX.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    networks:
      pbx:
        ipv4_address: 172.31.9.3
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-ip=172.31.9.3"
      - "--listening-port=3478"
      - "--relay-ip=172.31.9.3"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--realm=tolkyn"
      - "--lt-cred-mech"
      - "--user=${PBX_TURN_USER:-tolkyn}:${PBX_TURN_PASSWORD:?set PBX_TURN_PASSWORD in .env}"
      - "--external-ip=${PBX_PUBLIC_IP:?set PBX_PUBLIC_IP in .env}/172.31.9.3"
      - "--no-tls"
      - "--no-dtls"
      - "--no-cli"
      - "--no-multicast-peers"

  # PBX for the Cloud One SIP trunk. On its own bridge network with a fixed IP
  # (one interface — Asterisk's pjproject ICE breaks when it sees the host's
  # many Docker bridges). RTP ports are published; SDP advertises the public IP
  # via external_media_address, and STUN gives the WebRTC leg a reflexive
  # candidate. See asterisk/README.md.
  asterisk:
    build:
      context: ./asterisk
    restart: unless-stopped
    networks:
      pbx:
        ipv4_address: 172.31.9.2
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
      - "127.0.0.1:8188:8188"
    environment:
      CLOUDONE_SIP_HOST: ${CLOUDONE_SIP_HOST:-LS02.CLOUDONE.CO.KE}
      CLOUDONE_SIP_USER: ${CLOUDONE_SIP_USER:?set CLOUDONE_SIP_USER in .env}
      CLOUDONE_SIP_PASSWORD: ${CLOUDONE_SIP_PASSWORD:?set CLOUDONE_SIP_PASSWORD in .env}
      CLOUDONE_DID: ${CLOUDONE_DID:-254207901958}
      PBX_PUBLIC_IP: ${PBX_PUBLIC_IP:?set PBX_PUBLIC_IP in .env}
      SOFTPHONE_EXT: ${SOFTPHONE_EXT:-1001}
      SOFTPHONE_EXT_PASSWORD: ${SOFTPHONE_EXT_PASSWORD:?set SOFTPHONE_EXT_PASSWORD in .env}
      PBX_WS_PORT: ${PBX_WS_PORT:-8188}
    volumes:
      # voicemail + call recordings survive a container rebuild; a Docker named
      # volume is seeded from the image on first use so the default spool tree
      # is preserved.
      - asterisk_spool:/var/spool/asterisk
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core waitfullybooted"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Bound to localhost only — the host's own nginx (which owns :80/:443 and
      # terminates TLS) reverse-proxies tolkyn.co.ke to this port. Not exposed
      # to the internet directly. See DEPLOYMENT.md → "Behind a host nginx".
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks: [internal]

networks:
  internal:
    driver: bridge
  # dedicated net for the PBX + TURN so they get fixed IPs and don't inherit
  # the host's interface soup
  pbx:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.9.0/24

volumes:
  postgres_data:
  backend_media:
  whatsapp_sessions:
  asterisk_spool:
