# ─────────────────────────────────────────────────────────────────────────
# HOST nginx vhost for the PBX WebSocket (pbx.tolkyn.co.ke).
#
# Terminates TLS with the same Cloudflare Origin cert as the main site
# (*.tolkyn.co.ke) and proxies the SIP-over-WebSocket upgrade to the Asterisk
# container, which listens on 127.0.0.1:8188 (host networking).
#
# Only /ws is exposed — nothing else on this host is public.
#
# Install:
#   sudo cp nginx/host-pbx.tolkyn.co.ke.conf /etc/nginx/sites-available/pbx.tolkyn.co.ke
#   sudo ln -s /etc/nginx/sites-available/pbx.tolkyn.co.ke /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name pbx.tolkyn.co.ke;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pbx.tolkyn.co.ke;

    ssl_certificate     /etc/ssl/cloudflare/tolkyn.co.ke.pem;
    ssl_certificate_key /etc/ssl/cloudflare/tolkyn.co.ke.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # SIP.js connects here. Keep the upgraded socket open for the life of the
    # agent's session; SIP.js sends its own keep-alives.
    location /ws {
        proxy_pass http://127.0.0.1:8188/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location / {
        return 404;
    }
}
