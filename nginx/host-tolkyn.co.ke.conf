# ─────────────────────────────────────────────────────────────────────────
# HOST nginx vhost (NOT the container's nginx.conf).
#
# Use this when the server already runs its own nginx on :80/:443 fronting
# several apps. The Tolkyn stack's own nginx is published on 127.0.0.1:8090
# (see docker-compose.yml) and this vhost proxies the public domain to it.
#
# Install:
#   sudo cp nginx/host-tolkyn.co.ke.conf /etc/nginx/sites-available/tolkyn.co.ke
#   sudo ln -s /etc/nginx/sites-available/tolkyn.co.ke /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a certificate — certbot rewrites this file in place to add the
# :443 server block and the http→https redirect:
#   sudo certbot --nginx -d tolkyn.co.ke -d www.tolkyn.co.ke
# ─────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name tolkyn.co.ke www.tolkyn.co.ke;

    # Matches client_max_body_size in the container nginx.conf.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
