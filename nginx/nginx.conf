worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Real client IP behind the proxy — everything downstream (rate limiting,
    # activity logging, Redis lock attribution) keys off this being correct.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Don't let one slow/malicious client hold a worker open forever.
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;
    client_max_body_size 25m;

    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name tolkyn.co.ke www.tolkyn.co.ke;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        limit_req zone=general burst=40 nodelay;

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /media/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Once you have a real TLS certificate (e.g. via certbot — see
    # DEPLOYMENT.md), point it here and redirect the plain :80 server above to
    # https instead of proxying directly.
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name tolkyn.co.ke www.tolkyn.co.ke;
    #     ssl_certificate     /etc/letsencrypt/live/tolkyn.co.ke/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/tolkyn.co.ke/privkey.pem;
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #     ... same location blocks as above ...
    # }
}
