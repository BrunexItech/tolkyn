[general]
rtpstart = 10000
rtpend = 20000

; WebRTC (browser) legs use ICE. With network_mode: host, Asterisk sees every
; Docker bridge interface (172.x) — advertising those as ICE candidates just
; wastes time and breaks negotiation. Blacklist all private ranges so the only
; candidate offered is the real public IP on eth0 (plus its STUN reflexive).
icesupport = yes
stunaddr = stun.l.google.com:19302
ice_blacklist = 172.16.0.0/12
ice_blacklist = 10.0.0.0/8
ice_blacklist = 169.254.0.0/16
ice_blacklist = 192.168.0.0/16
stun_blacklist = 172.16.0.0/12
stun_blacklist = 10.0.0.0/8

; The trunk leg (plain SIP/UDP to Cloud One) uses the external_media_address
; set on transport-udp in pjsip.conf, not ICE.
