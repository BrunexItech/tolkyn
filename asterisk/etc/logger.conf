[general]
dateformat = %F %T

[logfiles]
; systemd journal / `journalctl -u asterisk` gets the notices
console => notice,warning,error,verbose(3)
messages => notice,warning,error
; /var/log/asterisk/full — full detail, incl. the DTLS / ICE / SRTP lines
; needed to debug the WebRTC softphone leg. Rotated by /etc/logrotate.d/asterisk.
full => notice,warning,error,debug,verbose
